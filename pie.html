<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página</title>

<style>
body{
    background: #6f0b0b;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
}
button{
    padding: 10px 25px;
    border: none;
    background: rgb(121, 21, 21);
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
}
button:hover{
    background: #ddd;
}
</style>
</head>

<body>

<button onclick="parent.anterior()">⟵ Anterior</button>
<button onclick="parent.siguiente()">Siguiente ⟶</button>

</body>
</html>
