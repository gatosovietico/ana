<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Final - Cultura de Paz</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Lato:wght@300;700&family=Merriweather:wght@300;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Lato", sans-serif;
            margin: 40px;
            background-color: #fff4f4;
            line-height: 1.6;
        }

        .marco-grande {
            width: 1400px;
            height: 580px;
            border: 5px solid rgba(150, 28, 28, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 30px;
            margin: 40px auto;
            border-radius: 20px;
            background-image: url("fondo3.png");
            background-size: cover;
            background-position: center;
        }

        h1{
            text-align:center;
            font-family:"Merriweather", serif;
            margin-bottom: 40px;
        }

        .boton-circular {
            width: 200px;
            height: 50px;
            background: #960c0c;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            margin: 15px;
            transition: all 0.3s ease;
        }

        .boton-circular:hover { background:#de1f1f; transform: scale(1.05); }

        .boton-container{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        marquee{
            color:#000000;
            font-family:"Merriweather", serif;
            font-size:18px;
            font-weight:bold;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<div class="marco-grande">

    <marquee scrollamount="7">✨ Final del proyecto educativo — Cultura de Paz ✨</marquee>

    <h1>¡Explora las siguientes secciones!</h1>

    <div class="boton-container">
        <button class="boton-circular" onclick="location.href='test.html'">Conclusiones</button>
        <button class="boton-circular" onclick="location.href='formulario.html'">Formulario</button>
        <button class="boton-circular" onclick="location.href='agradecimientos.html'">Agradecimientos</button>
    </div>

    <footer style="margin-top: 30px; font-family:'Poppins', sans-serif;">
        Proyecto educativo — Cultura de Paz • Diseñado para uso escolar
    </footer>

</div>

</body>
</html>
